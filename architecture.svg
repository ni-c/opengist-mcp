  <title id="arch-title">How opengist-mcp sits between an MCP client and an Opengist instance</title>
  <desc id="arch-desc">The MCP client speaks stdio to opengist-mcp, which calls the Opengist REST API over HTTPS with a bearer token. Every response passes through a shaping layer that bounds it and marks it as untrusted, and destructive calls are put to a person first.</desc>

