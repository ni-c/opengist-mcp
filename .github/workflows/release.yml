name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      # --ignore-scripts: this job holds an OIDC credential for Trusted
      # Publishing, so a postinstall script of any transitive dependency must
      # not run here. The package's own prepublishOnly (build) still runs
      # during npm publish; lint and tests ran in the `test` job this one needs.
      - run: npm ci --ignore-scripts
      - run: npm publish --provenance

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their version
          # lives in the identifier tag instead. Touch BOTH package entries.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # ci.yml pushes the image in a parallel run on the same tag, so the
      # registry's ownership check would race it. Wait until GHCR serves the tag.
      - name: Wait for the GHCR image tag
        run: |
          version="$(node -p "require('./package.json').version")"
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:ni-c/opengist-mcp:pull&service=ghcr.io' | jq -r .token)"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ni-c/opengist-mcp/manifests/$version"; then
              echo "ghcr.io/ni-c/opengist-mcp:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/opengist-mcp:$version ($i/60)"
            sleep 30
          done
          echo "Image tag $version never appeared on GHCR — is ci.yml's publish job green?" >&2
          exit 1
      - name: Install mcp-publisher
        # Pinned to a version with a checksum instead of following
        # releases/latest: this job holds the registry OIDC credential, and
        # every GitHub Action around it is SHA-pinned — piping an unverified
        # binary from the network into the same job would defeat that.
        # Bump both values together; the checksum is of the linux_amd64 tarball.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No changelog section found for version $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
