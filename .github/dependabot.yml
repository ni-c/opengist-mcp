version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep lockstep packages together so major bumps don't arrive as
      # individually broken PRs.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
      minor-and-patch:
        update-types:
          - minor
          - patch

    ignore:
      # typescript-eslint's peer range gates the TypeScript major: as of 8.67.0 it
      # declares typescript ">=4.8.4 <6.1.0", so TS 7 cannot be installed here at
      # all — npm aborts with ERESOLVE. Stated here rather than left as the
      # "@dependabot ignore this major version" comment on the closed PR #1,
      # because that lives in GitHub's per-PR state while the reason belongs next
      # to the constraint. Unignore once that peer range moves.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The docs site has its own manifest and lockfile on purpose — the VitePress
  # toolchain must never enter the root one, which is installed in the Docker
  # build and in every test-matrix job.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly

  # The Dockerfile pins its base image by digest, which nothing would ever
  # refresh without this entry.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node majors are curated by hand: Dependabot offers the newest tag, but
      # the runtime image has to sit on an ACTIVE LTS line, and half of the
      # majors are not LTS at all (26 is a current release, 24 is LTS Krypton).
      # Digest and minor refreshes of the pinned line still come through.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot. Ungrouped,
      # one of them bumps first and the version mismatch fails the CodeQL job.
      codeql:
        patterns:
          - github/codeql-action*
      # The docker/* actions are released in lockstep and used in one job.
      docker:
        patterns:
          - docker/*
